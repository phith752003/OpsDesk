services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opsdesk_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: opsdesk
      DB_USERNAME: opsdesk_user
      DB_PASSWORD: opsdesk_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - opsdesk_net

  web:
    image: nginx:alpine
    container_name: opsdesk_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - opsdesk_net

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: opsdesk_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - web
    networks:
      - opsdesk_net

  db:
    image: mysql:8.0
    container_name: opsdesk_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: opsdesk
      MYSQL_USER: opsdesk_user
      MYSQL_PASSWORD: opsdesk_secret_password
      MYSQL_ROOT_PASSWORD: opsdesk_root_password
    ports:
      - "3306:3306"
    volumes:
      - opsdesk_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opsdesk_net

  redis:
    image: redis:alpine
    container_name: opsdesk_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - opsdesk_redis_data:/data
    networks:
      - opsdesk_net

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: opsdesk_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: production
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: opsdesk
      DB_USERNAME: opsdesk_user
      DB_PASSWORD: opsdesk_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - app
      - db
      - redis
    networks:
      - opsdesk_net

networks:
  opsdesk_net:
    driver: bridge

volumes:
  opsdesk_db_data:
  opsdesk_redis_data:
